# CI for Udyam Digital (POLICIES.md §15 controls register).
# A failing privacy-gate report or KYC answer-key check fails the build: that is the
# stop condition before any deploy or before GEMINI_API_KEY is set on a demo build.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -p no:warnings --junitxml=../evidence-ci/pytest-junit.xml
      - name: Privacy-gate red-team report (fails on any leak)
        run: python scripts/privacy_gate_report.py && cp ../evidence/privacy_gate/report.md ../evidence-ci/privacy-gate-report.md
      - name: KYC pipeline vs answer key on all 47 specimens (fails on any mismatch or false accept)
        run: python scripts/kyc_pipeline_check.py && cp ../evidence/kyc_pipeline/report.md ../evidence-ci/kyc-answer-key-report.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: evidence-ci/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
